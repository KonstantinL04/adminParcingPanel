apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminparcing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminparcing
  template:
    metadata:
      labels:
        app: adminparcing
    spec:
      containers:
        - name: adminparcing
          image: your-dockerhub/adminparcing:latest
          env:
            - name: EVENTS_API_URL
              value: http://events:8000/api/events
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: adminparcing
spec:
  selector:
    app: adminparcing
  ports:
    - port: 8000